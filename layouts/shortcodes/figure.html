{{ $src := .Get "src" }}
{{ $title := .Get "title" }}
{{ $alt := .Get "alt" | default $title | default "Figure" }}
{{ $width := .Get "width" }}
{{ $height := .Get "height" }}
{{ $panel := .Get "panel" | default "default" }}
{{ $detail := .Get "detail" }}

<figure class="zonge-inline-figure{{ if eq $panel "light" }} zonge-inline-figure-light{{ end }}"{{ with $width }} style="max-width: {{ . }}px; margin-left: auto; margin-right: auto;"{{ end }}>
  {{ if $detail }}
  {{ $previewSize := imageConfig (printf "static/%s" (strings.TrimPrefix "/" $src)) }}
  {{ $detailSize := imageConfig (printf "static/%s" (strings.TrimPrefix "/" $detail)) }}
  <a href="{{ $detail | relURL }}" aria-label="View larger diagram: {{ $alt }}">
    <img src="{{ $src | relURL }}" srcset="{{ $src | relURL }} {{ $previewSize.Width }}w, {{ $detail | relURL }} {{ $detailSize.Width }}w" sizes="(max-width: 1199px) calc(100vw - 90px), 1060px" width="{{ $previewSize.Width }}" height="{{ $previewSize.Height }}" alt="{{ $alt }}" class="img-responsive" loading="lazy" decoding="async" style="width: 100%; height: auto;">
  </a>
  <figcaption>{{ with $title }}{{ . }} · {{ end }}<a href="{{ $detail | relURL }}">View larger diagram</a></figcaption>
  {{ else }}
  <img src="{{ $src }}" alt="{{ $alt }}" class="img-responsive"{{ if or $width $height }} style="{{ with $width }}max-width: {{ . }}px; width: 100%;{{ end }}{{ with $height }} max-height: {{ . }}px; height: auto;{{ end }}"{{ end }}>
  {{ with $title }}
  <figcaption>{{ . }}</figcaption>
  {{ end }}
  {{ end }}
</figure>
